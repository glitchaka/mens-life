[package]
name = "mens-life"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Vida Isométrica 3D — juego de escritorio nativo en Rust"
publish = false

[[bin]]
name = "mens-life"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bevy = { version = "=0.17.3", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_log", "bevy_pbr", "bevy_render", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_window", "bevy_winit", "multi_threaded", "png", "x11"] }
bevy_egui = { version = "=0.38.0", default-features = false, features = ["default_fonts", "render"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
