[package]
name = "mens-life"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Vida Isométrica 3D: simulación e interfaz en Rust"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mens-life"
path = "src/desktop.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tao", "dep:wry"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.104"
js-sys = "=0.3.81"
console_error_panic_hook = "0.1.7"
web-sys = { version = "=0.3.81", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Event", "EventTarget", "PointerEvent", "Performance", "CssStyleDeclaration", "Node", "console"] }

[target.'cfg(windows)'.dependencies]
tao = { version = "=0.34.5", optional = true }
wry = { version = "=0.53.5", optional = true, default-features = false, features = ["protocol"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
