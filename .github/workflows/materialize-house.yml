name: Materialize house asset

on:
  push:
    paths:
      - 'assets/house/.upload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild house GLB
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/house/.upload/READY || exit 0
          cat assets/house/.upload/part-*.b64 | base64 --decode > assets/house/house.glb
          echo "5abcf18fe748ba0b078bc3ad137a54d7ce9cef28f0abfda59a305feac83b64ae  assets/house/house.glb" | sha256sum -c -
          test "$(stat -c%s assets/house/house.glb)" = "1339348"
          rm -rf assets/house/.upload

      - name: Commit binary asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A assets/house
          git diff --cached --quiet && exit 0
          git commit -m "Add reconstructed Autumn House GLB"
          git push
