name: Build Windows executable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/mens-life-windows-x64/assets/fonts
          Copy-Item target/release/mens-life.exe, README.md, THIRD_PARTY.md artifacts/mens-life-windows-x64/
          Copy-Item assets/fonts/*.txt artifacts/mens-life-windows-x64/assets/fonts/
      - uses: actions/upload-artifact@v4
        with:
          name: mens-life-windows-x64
          path: artifacts/mens-life-windows-x64/
