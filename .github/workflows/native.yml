name: Build Windows executable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Prepare packaged assets
        shell: pwsh
        run: .\tools\ensure-assets.ps1
      - name: Inspect character animations
        run: python tools/inspect_character_assets.py
      - run: cargo build --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/mens-life-windows-x64/assets/fonts
          New-Item -ItemType Directory -Force artifacts/mens-life-windows-x64/assets/house
          Copy-Item target/release/mens-life.exe, README.md, THIRD_PARTY.md, install.cmd artifacts/mens-life-windows-x64/
          Copy-Item assets/fonts/*.txt artifacts/mens-life-windows-x64/assets/fonts/
          Copy-Item assets/house/house.glb artifacts/mens-life-windows-x64/assets/house/house.glb
          New-Item -ItemType Directory -Force artifacts/mens-life-windows-x64/MSPA-Lib
          Copy-Item vendor/MSPA-Lib/UPSTREAM.md, vendor/MSPA-Lib/README.md artifacts/mens-life-windows-x64/MSPA-Lib/
      - uses: actions/upload-artifact@v4
        with:
          name: mens-life-windows-x64
          path: artifacts/mens-life-windows-x64/
