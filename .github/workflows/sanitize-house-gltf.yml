name: Sanitize house glTF

on:
  push:
    branches: [main]
    paths:
      - 'assets/two_stories_with_interiors.glb'
      - '.github/workflows/sanitize-house-gltf.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert legacy specular-glossiness materials
        shell: python
        run: |
          import json, struct
          from pathlib import Path

          path = Path('assets/two_stories_with_interiors.glb')
          data = path.read_bytes()
          if data[:4] != b'glTF':
              raise SystemExit('Not a binary glTF file')
          version, total = struct.unpack_from('<II', data, 4)
          if version != 2:
              raise SystemExit(f'Unsupported GLB version {version}')

          chunks = []
          offset = 12
          while offset < len(data):
              length, ctype = struct.unpack_from('<II', data, offset)
              offset += 8
              payload = data[offset:offset + length]
              offset += length
              chunks.append([ctype, payload])

          JSON = 0x4E4F534A
          json_index = next((i for i, (t, _) in enumerate(chunks) if t == JSON), None)
          if json_index is None:
              raise SystemExit('GLB has no JSON chunk')

          raw = chunks[json_index][1].rstrip(b' \t\r\n\x00')
          doc = json.loads(raw.decode('utf-8'))
          ext_name = 'KHR_materials_pbrSpecularGlossiness'
          changed = False

          for key in ('extensionsRequired', 'extensionsUsed'):
              values = doc.get(key)
              if isinstance(values, list) and ext_name in values:
                  doc[key] = [v for v in values if v != ext_name]
                  if not doc[key]:
                      doc.pop(key, None)
                  changed = True

          for material in doc.get('materials', []):
              extensions = material.get('extensions')
              if not isinstance(extensions, dict):
                  continue
              legacy = extensions.pop(ext_name, None)
              if legacy is None:
                  continue
              changed = True
              pbr = material.setdefault('pbrMetallicRoughness', {})
              if 'diffuseFactor' in legacy and 'baseColorFactor' not in pbr:
                  pbr['baseColorFactor'] = legacy['diffuseFactor']
              if 'diffuseTexture' in legacy and 'baseColorTexture' not in pbr:
                  pbr['baseColorTexture'] = legacy['diffuseTexture']
              pbr.setdefault('metallicFactor', 0.0)
              gloss = float(legacy.get('glossinessFactor', 0.35))
              pbr.setdefault('roughnessFactor', max(0.0, min(1.0, 1.0 - gloss)))
              if not extensions:
                  material.pop('extensions', None)

          if not changed:
              print('House GLB already uses Bevy-compatible materials.')
              raise SystemExit(0)

          encoded = json.dumps(doc, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          encoded += b' ' * ((4 - len(encoded) % 4) % 4)
          chunks[json_index][1] = encoded

          out = bytearray(b'glTF' + struct.pack('<I', 2) + b'\x00\x00\x00\x00')
          for ctype, payload in chunks:
              if len(payload) % 4:
                  payload += b'\x00' * (4 - len(payload) % 4)
              out += struct.pack('<II', len(payload), ctype)
              out += payload
          struct.pack_into('<I', out, 8, len(out))
          path.write_bytes(out)
          print(f'Converted {path} ({len(data)} -> {len(out)} bytes)')

      - name: Commit compatible GLB
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/two_stories_with_interiors.glb; then
            echo 'No GLB changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/two_stories_with_interiors.glb
          git commit -m 'Convert house GLB materials for Bevy'
          git push
